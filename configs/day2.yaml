# Day 2 configuration — data pipeline + continued pretraining (CPT).
# Conservative CPT of Qwen3-1.7B-Base on an LLM/ML corpus, targeting one A40 (~44GB).

model:
  id: "Qwen/Qwen3-1.7B-Base"
  revision: "main"                     # cpt.py resolves this to an immutable HF commit at runtime
  dtype: "bfloat16"

data:
  # ---- domain sources ----
  arxiv_dataset: "jamescalam/ai-arxiv"
  arxiv_max_docs: 400

  doc_seed_urls:
    - "https://huggingface.co/docs/transformers/index"
    - "https://huggingface.co/docs/peft/index"
    - "https://huggingface.co/docs/trl/index"
    - "https://pytorch.org/docs/stable/index.html"
  doc_max_pages: 150
  doc_request_delay_sec: 0.5

  theory_seed_urls:
    - "https://huggingface.co/blog"
    - "https://huggingface.co/learn/llm-course/en/chapter1/1"
  theory_max_pages: 120

  d2l_github_raw: "https://raw.githubusercontent.com/d2l-ai/d2l-en/master"
  d2l_chapters:
    - "chapter_attention-mechanisms-and-transformers"
    - "chapter_recurrent-neural-networks"
    - "chapter_recurrent-modern"
    - "chapter_multilayer-perceptrons"
    - "chapter_optimization"
    - "chapter_linear-regression"
    - "chapter_natural-language-processing-pretraining"

  arxiv_survey_query: "large language models survey"
  arxiv_survey_max: 40

  # ---- general replay / anti-forgetting ----
  replay_dataset: "HuggingFaceFW/fineweb-edu"
  replay_subset: "sample-10BT"
  replay_max_docs: 800
  replay_ratio: 0.15

  eval_heldout_frac: 0.10
  val_frac: 0.05
  min_doc_chars: 300
  seed: 42

tokenize:
  block_size: 1024
  token_budget: 3_000_000

paths:
  raw_dir: "data/raw"
  clean_dir: "data/clean"
  packed_dir: "data/packed"
  eval_heldout_dir: "data/eval_heldout"
  manifest: "data/manifest.json"
  cpt_output_dir: "artifacts/cpt-v1"

train:
  # LoRA is intentionally used for this small CPT run. The final adapter is merged
  # into the BASE weights, so artifacts/cpt-v1 is still a normal standalone model.
  method: "full"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                        "gate_proj", "up_proj", "down_proj"]

  # More conservative than the previous 2e-4 setting because the corpus is only ~3M tokens.
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0

  per_device_batch_size: 4
  grad_accum_steps: 8                  # effective batch = 32 x 1024-token blocks
  num_epochs: 1
  bf16: true
  gradient_checkpointing: true

  logging_steps: 5
  save_steps: 25
  eval_steps: 20

  # Safety checks added after the broken run.
  clean_output_dir: true               # prevents stale broken tokenizer/adapter files surviving a rerun
  require_eos_in_packed: true          # abort CPT if the packed stream has no EOS/document boundaries

comparison:
  # BASE is generated before training; CPT is generated after merge, using exactly
  # the same tokenizer, raw prompts, greedy decoding, and token limit.
  max_new_tokens: 128
  prompts:
    - "What is attention in a transformer?"
    - "Explain what a tokenizer does, simply."
    - "Give me three tips for fine-tuning an LLM."
    - "Who are you?"

evaluation:
  domain_ppl_docs: 50
  general_ppl_docs: 50
  max_ppl_tokens: 100_000
